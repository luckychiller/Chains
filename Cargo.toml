[package]
name = "chains"
version = "0.1.0"
edition = "2021"

[dependencies]
sled = "0.34"
tokio = { version = "1", features = ["full", "io-util"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
ed25519-dalek = { version = "2.0", features = ["serde"] }
blake3 = "1.5"
rand = "0.8"
hex = "0.4"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets", "serde"] }
sha2 = "0.10"
hmac = "0.12"
libp2p = { version = "0.53", default-features = false, features = [
    "tcp", "tokio", "noise", "yamux", "kad", "gossipsub", "mdns", "identify", "macros", "request-response", "cbor"
] }
futures = "0.3"
void = "1"

[dev-dependencies]
tempfile = "3"
proptest = "1"